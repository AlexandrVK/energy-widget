name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk energy-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: energy-widget
          path: energy-widget.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest energy-widget.apk \
            --title "Latest build" \
            --notes "Автосборка из коммита ${{ github.sha }}" \
            --target ${{ github.sha }}
